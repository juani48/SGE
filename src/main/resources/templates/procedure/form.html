<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <div th:replace="~{layout :: body}">
        <div th:fragment="content" class="container-fluid">
            <h2 th:if="${procedure.id == null}"><i class="bi bi-plus-circle icon-brand"></i> Nuevo trámite</h2>
            <h2 th:if="${procedure.id != null}"><i class="bi bi-pencil icon-brand"></i> Editar trámite #<span th:text="${procedure.id}"></span></h2>

            <form th:action="${procedure.id == null} ? @{/api/procedure/create} : @{/api/procedure/update/{id}(id=${procedure.id})}" method="post" class="needs-validation" novalidate>
                <input type="hidden" th:field="${procedure.id}" />
                <input type="hidden" th:field="${procedure.fileId}" />
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label for="content" class="form-label">Contenido</label>
                    <textarea class="form-control" id="content" th:field="${procedure.content}" rows="5" required></textarea>
                    <div class="invalid-feedback">El contenido es obligatorio</div>
                </div>
                <div class="mb-3">
                    <label for="state" class="form-label">Estado</label>
                    <select class="form-select" id="state" th:field="${procedure.state}">
                        <option th:value="DOCUMENT_SUBMITTED" default>Documento presentado</option>
                        <option th:value="REFERRED_FOR_REVIEW">Derivado a revisión</option>
                        <option th:value="OFFICE">Despacho</option>
                        <option th:value="RESOLUTION">Resolución</option>
                        <option th:value="NOTIFICATION">Notificación</option>
                        <option th:value="FORWARDED_TO_ARCHIVE">Derivado a archivo</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/file/detail/{id}(id=${procedure.fileId})}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
    <script>
        // Bootstrap validation (mismo que en file/form)
        (function() {
            'use strict';
            var forms = document.querySelectorAll('.needs-validation');
            Array.prototype.slice.call(forms).forEach(function(form) {
                form.addEventListener('submit', function(event) {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        })();
    </script>
</body>
</html>
