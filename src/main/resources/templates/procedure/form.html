<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title th:text="${procedure.id != null} ? 'Editar Trámite' : 'Crear Trámite'"></title>
</head>
<body>
<div layout:fragment="content">
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title" th:text="${procedure.id != null} ? 'Editar Trámite' : 'Crear Trámite'"></h3>
                        <form th:action="@{${procedure.id != null} ? '/api/procedure/update' : '/api/procedure/create'}" method="post" class="mt-3">
                            <input type="hidden" th:if="${procedure.id != null}" name="id" th:value="${procedure.id}" />
                            <input type="hidden" th:if="${procedure.fileId != null}" name="fileId" th:value="${procedure.fileId}" />

                            <div class="mb-3">
                                <label for="content" class="form-label">Contenido</label>
                                <input type="text" class="form-control" id="content" name="content" th:value="${procedure.content}" placeholder="Ingrese el contenido:" required>
                            </div>

                            <div class="mb-3" th:if="${procedure.id != null}">
                                <label for="state" class="form-label">Estado</label>
                                <select class="form-select" id="state" name="state">
                                    <option value="NEWLY_STARTED" th:selected="${procedure.state == 'DOCUMENT_SUBMITTED'}">Documento presentado</option>
                                    <option value="TO_BE_RESOLVED" th:selected="${procedure.state == 'REFERRED_FOR_REVIEW'}">Derivado a revisión</option>
                                    <option value="RESOLVED" th:selected="${procedure.state == 'OFFICE'}">Despacho</option>
                                    <option value="IN_NOTIFICATION" th:selected="${procedure.state == 'RESOLUTION'}">Resolución</option>
                                    <option value="COMPLETED" th:selected="${procedure.state == 'NOTIFICATION'}">Notificación</option>
                                    <option value="COMPLETED" th:selected="${procedure.state == 'FORWARDED_TO_ARCHIVE'}">Derivado a archivo</option>
                                </select>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-success" th:text="${procedure.id != null} ? 'Actualizar' : 'Guardar'"></button>
                                <a th:href="@{/files}" class="btn btn-secondary">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
