<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}"></head>

<body>
    <div th:replace="~{layout :: body}">
        <div th:fragment="content" class="container-fluid">
            <div class="card">
                <div class="card-body text-center">
                    <i class="bi bi-exclamation-octagon icon-brand" style="font-size: 3rem;"></i>
                    <h3 class="mt-3">Ocurrió un problema inesperado</h3>
                    <p class="text-muted" th:text="${message} ?: 'El servidor no responde.'"></p>
                    <a class="btn btn-primary" th:href="@{/}">Volver al inicio</a>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
