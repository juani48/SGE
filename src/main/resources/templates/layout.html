<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGE - Sistema de Gestión</title>
    <!-- Bootstrap 5 + CSS personalizado -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <!-- Navbar superior -->
    <nav class="navbar navbar-legal navbar-expand-lg sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand ms-3" href="/">
                <i class="bi bi-scale"></i> SGE Legal
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTop">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarTop">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/file/list}">
                            <i class="bi bi-folder2-open"></i> Expedientes
                        </a>
                    </li>
                    <li>
                        <a class="nav-link" th:href="@{/file/create}">
                            <i class="bi bi-file-earmark-plus"></i> Nuevo expediente
                        </a>
                    </li>
                    <!-- Solo para admin (se muestra si el usuario tiene rol ADMIN) -->
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/admin/users}">
                            <i class="bi bi-people"></i> Usuarios
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle"></i> <!-- Icono de usuario -->
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person-circle"></i>
                                    Perfil</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" th:href="@{/logout}"><i class="bi bi-box-arrow-right"></i>
                                    Salir</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="content-wrapper d-flex flex-column flex-lg-row">
            <!-- main centrado horizontalmente -->
            <main class="mx-auto px-md-4 py-3 w-75"> <!-- o usa col-lg-8 en vez de w-75 -->
                <div th:replace="~{fragments/messages :: messages}"></div>
                <div th:replace="~{${content} :: content}"></div>
            </main>
        </div>
    </div>

    <!-- Modales reutilizables -->
    <div th:replace="~{fragments/modals :: modals}"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>

</html>
