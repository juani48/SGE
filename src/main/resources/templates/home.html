<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <div th:replace="~{layout :: body}">
        <div th:fragment="content" class="container-fluid">
            <h1 class="mb-4"><i class="bi bi-house-door icon-brand"></i> Bienvenido al Sistema de Gestión</h1>
            <p>Resumen de actividad reciente o estadísticas.</p>
            <!-- Aquí podrías mostrar gráficos o datos resumidos -->
            <div class="row">
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Expedientes</h5>
                            <p class="display-4" th:text="${fileCount}"></p>
                            <a th:href="@{/file/list}" class="btn btn-outline-primary">Ver todos</a>
                        </div>
                    </div>
                </div>
                <!-- Más tarjetas -->
            </div>
        </div>
    </div>
</body>
</html>
