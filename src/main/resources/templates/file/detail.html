<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}"></head>

<body>
    <div th:replace="~{layout :: body}">
        <div th:fragment="content" class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2><i class="bi bi-folder icon-brand"></i> Expediente #<span th:text="${file.id}"></span></h2>
                <div>
                    <a th:href="@{/file/update/{id}(id=${file.id})}" class="btn btn-outline-secondary"
                        sec:authorize="hasRole('ADMIN') or hasRole('EDIT_FILE')"><i class="bi bi-pencil"></i> Editar</a>
                    <button class="btn btn-outline-danger" data-bs-toggle="modal" data-bs-target="#confirmDeleteModal"
                        data-delete-url="@{/file/delete/{id}(id=${file.id})}"
                        data-delete-message="¿Eliminar expediente '${file.cover}'?"
                        sec:authorize="hasRole('ADMIN') or hasRole('DELETE_FILE')">
                        <i class="bi bi-trash3"></i> Eliminar
                    </button>
                     <a th:href="@{/file/list}" class="btn btn-outline-primary"><i
                            class="bi bi-arrow-left"></i> Volver a la lista de expedientes</a>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header">Datos del expediente</div>
                <div class="card-body">
                    <dl class="row">
                        <dt class="col-sm-3">Carátula</dt>
                        <dd class="col-sm-9" th:text="${file.cover}"></dd>
                        <dt class="col-sm-3">Estado</dt>
                        <dd class="col-sm-9">
                            <span class="badge" th:class="${fileStateClassMap.get(file.state)}"
                                th:text="${file.state}"></span>
                        </dd>
                        <dt class="col-sm-3">Fecha creación</dt>
                        <dd class="col-sm-9" th:text="${file.creation}"></dd>
                        <dt class="col-sm-3">Última modificación</dt>
                        <dd class="col-sm-9" th:text="${file.modification}"></dd>
                        <dt class="col-sm-3">Modificado por</dt>
                        <dd class="col-sm-9" th:text="${file.modificationUserEmail}"></dd>
                    </dl>
                </div>
            </div>

            <h4 class="mt-4"><i class="bi bi-list-ul"></i> Trámites asociados</h4>
            <div class="d-flex justify-content-end mb-2">
                <a th:href="@{/procedure/create/{fileId}(fileId=${file.id})}" class="btn btn-primary btn-sm">
                    <i class="bi bi-plus-circle"></i> Agregar trámite
                </a>
            </div>

            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Contenido</th>
                            <th>Estado</th>
                            <th>Fecha</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="proc : ${procedures}">
                            <td th:text="${proc.id}"></td>
                            <td th:text="${proc.content}"></td>
                            <td>
                                <span class="badge" th:class="${procedureStateClassMap.get(proc.state)}"
                                    th:text="${proc.state}"></span>
                            </td>
                            <td th:text="${proc.creation}"></td>
                            <td>
                                <a th:href="@{/procedure/detail/{id}(id=${proc.id})}" class="btn btn-sm btn-outline-primary"><i
                                        class="bi bi-eye"></i></a>
                                <a th:href="@{/procedure/update/{id}(id=${proc.id})}"
                                    class="btn btn-sm btn-outline-secondary"
                                    sec:authorize="hasRole('ADMIN') or hasRole('EDIT_PROCEDURE')"><i
                                        class="bi bi-pencil"></i></a>
                                <button class="btn btn-sm btn-outline-danger" data-bs-toggle="modal"
                                    data-bs-target="#confirmDeleteModal"
                                    sec:authorize="hasRole('ADMIN') or hasRole('DELETE_PROCEDURE')"
                                    th:data-delete-url="@{/api/procedure/delete/{id}(id=${proc.id})}"
                                    th:data-delete-message="|Está seguro de eliminar el trámite: ${proc.content}?|">
                                    <i class="bi bi-trash3"></i>
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${procedures == null or procedures.empty}">
                            <td colspan="5" class="text-center">No hay trámites para este expediente</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <!-- Script para modal (similar al de list) -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const deleteModal = document.getElementById('confirmDeleteModal');
            deleteModal.addEventListener('show.bs.modal', function (event) {
                const button = event.relatedTarget;
                const url = button.getAttribute('data-delete-url');
                const message = button.getAttribute('data-delete-message') || '¿Está seguro de eliminar este elemento?';
                document.getElementById('confirmDeleteMessage').textContent = message;
                document.getElementById('confirmDeleteForm').action = url;
            });
        });
    </script>
</body>

</html>
