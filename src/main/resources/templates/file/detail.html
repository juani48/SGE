<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>Detalle del Expediente</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container mt-4">
            <h1><i class="bi bi-file-earmark-text"></i> Detalle del Expediente</h1>
            <div class="card shadow-sm">
                <div class="card-body">
                    <dl class="row">
                        <dt class="col-sm-3">ID</dt>
                        <dd class="col-sm-9" th:text="${file.id}"></dd>

                        <dt class="col-sm-3">Carátula</dt>
                        <dd class="col-sm-9" th:text="${file.cover}"></dd>

                        <dt class="col-sm-3">Estado</dt>
                        <dd class="col-sm-9">
                            <span class="badge"
                                th:class="${stateClassMap[file.state] != null ? stateClassMap[file.state] : 'bg-secondary'}"
                                th:text="${#strings.replace(file.state, '_', ' ')}">
                            </span>
                        </dd>

                        <dt class="col-sm-3">Fecha de creación</dt>
                        <dd class="col-sm-9" th:text="${file.creation}"></dd>

                        <dt class="col-sm-3">Última modificación</dt>
                        <dd class="col-sm-9" th:text="${file.modification}"></dd>

                        <dt class="col-sm-3">Usuario que modificó</dt>
                        <dd class="col-sm-9" th:text="${file.modificationUserEmail}"></dd>
                    </dl>
                </div>
            </div>
            <div class="mt-3">
                <a th:href="@{/files}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Volver a la lista</a>
                <a th:href="@{/file/update/{id}(id=${file.id})}" class="btn btn-warning"><i class="bi bi-pencil"></i>
                    Editar</a>
            </div>
        </div>

        <div class="mt-4">
            <h3><i class="bi bi-list-ul"></i> Trámites asociados</h3>
            <button th:href="@{/procedure/create/{fileId}(fileId=${file.id})}" class="btn btn-primary mb-3"><i class="bi bi-plus"></i> Agregar Trámite</button>

            <!-- Tabla de trámites -->
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Estado</th>
                        <th>Contenido</th>
                        <th>Fecha de creación</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="proc : ${procedurePage.content}">
                        <td th:text="${proc.id}"></td>
                        <td>
                            <span class="badge" th:class="${proc.state == 'PENDIENTE' ? 'bg-warning' : 
                                    proc.state == 'EN_PROCESO' ? 'bg-info' : 
                                    proc.state == 'FINALIZADO' ? 'bg-success' : 'bg-secondary'}"
                                th:text="${proc.state}"></span>
                        </td>
                        <td th:text="${proc.content}"></td>
                        <td th:text="${proc.creation}"></td>
                    </tr>
                    <tr th:if="${procedurePage.empty}">
                        <td colspan="4" class="text-center">No hay trámites registrados para este expediente.</td>
                    </tr>
                </tbody>
            </table>

            <!-- Paginación -->
            <div th:if="${procedurePage.totalPages > 1}">
                <nav aria-label="Paginación de trámites">
                    <ul class="pagination justify-content-center">
                        <!-- Anterior -->
                        <li class="page-item" th:classappend="${!procedurePage.hasPrevious()} ? 'disabled'">
                            <a class="page-link"
                                th:href="@{/file/{id}(id=${file.id}, page=${procedurePage.number - 1}, size=${procedurePage.size}, sort=${procedurePage.sort})}">
                                Anterior
                            </a>
                        </li>

                        <!-- Números de página -->
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, procedurePage.totalPages - 1)}"
                            th:classappend="${i == procedurePage.number} ? 'active'">
                            <a class="page-link"
                                th:href="@{/file/{id}(id=${file.id}, page=${i}, size=${procedurePage.size}, sort=${procedurePage.sort})}"
                                th:text="${i + 1}"></a>
                        </li>

                        <!-- Siguiente -->
                        <li class="page-item" th:classappend="${!procedurePage.hasNext()} ? 'disabled'">
                            <a class="page-link"
                                th:href="@{/file/{id}(id=${file.id}, page=${procedurePage.number + 1}, size=${procedurePage.size}, sort=${procedurePage.sort})}">
                                Siguiente
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</body>

</html>
