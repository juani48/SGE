<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Expediente</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1>Detalle del Expediente</h1>
    <div class="card">
        <div class="card-body">
            <dl class="row">
                <dt class="col-sm-3">ID</dt>
                <dd class="col-sm-9" th:text="${file.id}">1</dd>

                <dt class="col-sm-3">Cover</dt>
                <dd class="col-sm-9" th:text="${file.cover}">cover.jpg</dd>

                <dt class="col-sm-3">Estado</dt>
                <dd class="col-sm-9" th:text="${file.state}">ACTIVE</dd>

                <dt class="col-sm-3">Fecha de creación</dt>
                <dd class="col-sm-9" th:text="${file.creation}">2025-01-01</dd>

                <dt class="col-sm-3">Última modificación</dt>
                <dd class="col-sm-9" th:text="${file.modification}">2025-01-02</dd>

                <dt class="col-sm-3">Usuario modificador</dt>
                <dd class="col-sm-9" th:text="${file.modificationUserEmail}">user@example.com</dd>
            </dl>
        </div>
    </div>
    <a th:href="@{/files}" class="btn btn-secondary mt-3">Volver a la lista</a>
</div>
</body>
</html>
