<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title th:text="${file.id != null} ? 'Editar Expediente' : 'Crear Expediente'"></title>
</head>
<body>
<div layout:fragment="content">
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title" th:text="${file.id != null} ? 'Editar Expediente' : 'Crear Expediente'"></h3>
                        <form th:action="@{${file.id != null} ? '/api/file/update' : '/api/file/create'}" method="post" class="mt-3">
                            <input type="hidden" th:if="${file.id != null}" name="id" th:value="${file.id}">

                            <div class="mb-3">
                                <label for="cover" class="form-label">Carátula</label>
                                <input type="text" class="form-control" id="cover" name="cover" th:value="${file.cover}" placeholder="Ingrese la carátula" required>
                            </div>

                            <div class="mb-3" th:if="${file.id != null}">
                                <label for="state" class="form-label">Estado</label>
                                <select class="form-select" id="state" name="state">
                                    <option value="NEWLY_STARTED" th:selected="${file.state == 'NEWLY_STARTED'}">Recién iniciado</option>
                                    <option value="TO_BE_RESOLVED" th:selected="${file.state == 'TO_BE_RESOLVED'}">Por resolver</option>
                                    <option value="RESOLVED" th:selected="${file.state == 'RESOLVED'}">Resuelto</option>
                                    <option value="IN_NOTIFICATION" th:selected="${file.state == 'IN_NOTIFICATION'}">En notificación</option>
                                    <option value="COMPLETED" th:selected="${file.state == 'COMPLETED'}">Completado</option>
                                </select>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-success" th:text="${file.id != null} ? 'Actualizar' : 'Guardar'"></button>
                                <a th:href="@{/files}" class="btn btn-secondary">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
