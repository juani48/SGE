<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${file.id != null} ? 'Editar Expediente' : 'Crear Expediente'"></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1 th:text="${file.id != null} ? 'Editar Expediente' : 'Crear Expediente'"></h1>

    <!-- Formulario (el action deberá apuntar al endpoint correspondiente) -->
    <form th:action="@{${file.id != null} ? '/api/file/update' : '/api/file/create'}" method="post" class="mt-4">
        <!-- Campo oculto para el ID en caso de actualización -->
        <input type="hidden" th:if="${file.id != null}" name="id" th:value="${file.id}">

        <div class="mb-3">
            <label for="cover" class="form-label">Cover</label>
            <input type="text" class="form-control" id="cover" name="cover"
                   th:value="${file.cover}" placeholder="Ej: portada.jpg" required>
        </div>

        <!-- Campo de estado solo visible en actualización -->
        <div class="mb-3" th:if="${file.id != null}">
            <label for="state" class="form-label">Estado</label>
            <select class="form-select" id="state" name="state">
                <option value="NEWLY_STARTED" th:selected="${file.state == 'NEWLY_STARTED'}">Recién iniciado</option>
                <option value="TO_BE_RESOLVED" th:selected="${file.state == 'TO_BE_RESOLVED'}">Por resolver</option>
                <option value="RESOLVED" th:selected="${file.state == 'RESOLVED'}">Resuelto</option>
                <option value="IN_NOTIFICATION" th:selected="${file.state == 'IN_NOTIFICATION'}">En notificación</option>
                <option value="COMPLETED" th:selected="${file.state == 'COMPLETED'}">Completado</option>
            </select>
        </div>

        <button type="submit" class="btn btn-success" th:text="${file.id != null} ? 'Actualizar' : 'Guardar'">
            Guardar
        </button>
        <a th:href="@{/files}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
