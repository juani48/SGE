<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <div th:replace="~{layout :: body}">
        <div th:fragment="content" class="container-fluid">
            <h2 th:if="${file.id == null}"><i class="bi bi-plus-circle icon-brand"></i> Nuevo expediente</h2>
            <h2 th:if="${file.id != null}"><i class="bi bi-pencil icon-brand"></i> Editar expediente #<span th:text="${file.id}"></span></h2>

            <form th:action="${file.id == null} ? @{/api/file/create} : @{/api/file/update}" method="post" class="needs-validation" novalidate>
                <input type="hidden" th:field="${file.id}" />
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label for="cover" class="form-label">Carátula</label>
                    <input type="text" class="form-control" id="cover" th:field="${file.cover}" required>
                    <div class="invalid-feedback">La carátula es obligatoria</div>
                </div>
                <div class="mb-3" th:if="${file.id != null}">
                    <label for="state" class="form-label">Estado</label>
                    <select class="form-select" id="state" th:field="${file.state}">
                        <option th:value="NEWLY_STARTED" default>Recién iniciado</option>
                        <option th:value="IN_PROGRESS">Por resolver</option>
                        <option th:value="RESOLVED">Con resolución</option>
                        <option th:value="IN_NOTIFICATION">En notificación</option>
                        <option th:value="COMPLETED">Completado</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/file/list}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
    <script>
        // Bootstrap validation
        (function() {
            'use strict';
            var forms = document.querySelectorAll('.needs-validation');
            Array.prototype.slice.call(forms).forEach(function(form) {
                form.addEventListener('submit', function(event) {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        })();
    </script>
</body>
</html>
