<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>Lista de Expedientes</title>
</head>

<body>
    <div layout:fragment="content">
        <h2 class="text-center">Lista de Expedientes</h2>
        <button class="btn btn-primary mb-3" th:href="@{/file/create}">Crear Nuevo Expediente</button>
        <div class="table-responsive">
            <table class="table table-hover table-striped align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Carátula</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${page.content}">
                        <td th:text="${item.id}"></td>
                        <td th:text="${item.cover}"></td>
                        <td>
                            <span class="badge"
                                th:class="${stateClassMap[item.state] != null ? stateClassMap[item.state] : 'bg-secondary'}"
                                th:text="${item.state}"></span>
                        </td>
                        <td>
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/file/{id}(id=${item.id})}">Ver</a>
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/file/update/{id}(id=${item.id})}">Editar</a>
                            <a class="btn btn-sm btn-outline-danger" th:href="@{/file/delete/{id}(id=${item.id})}" onclick="return confirm('¿Estás seguro de que quieres eliminar este expediente?');">Eliminar</a>
                        </td>
                    </tr>
                    <tr th:if="${page.empty}">
                        <td colspan="4" class="text-center text-muted">No hay expedientes registrados.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <nav aria-label="Paginación de expedientes" th:if="${!page.empty}">
            <ul class="pagination justify-content-center">
                <!-- Botón Anterior -->
                <li class="page-item" th:classappend="${page.first} ? 'disabled' : ''">
                    <a class="page-link" th:href="@{/files(page=${page.number - 1}, size=${page.size})}"
                        aria-label="Anterior">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                </li>

                <!-- Números de página -->
                <li th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}" class="page-item"
                    th:classappend="${i == page.number} ? 'active' : ''">
                    <a class="page-link" th:href="@{/files(page=${i}, size=${page.size})}" th:text="${i + 1}"></a>
                </li>

                <!-- Botón Siguiente -->
                <li class="page-item" th:classappend="${page.last} ? 'disabled' : ''">
                    <a class="page-link" th:href="@{/files(page=${page.number + 1}, size=${page.size})}"
                        aria-label="Siguiente">
                        <span aria-hidden="true">&raquo;</span>
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Opcional: mostrar información de total de elementos y página actual -->
        <div class="text-muted text-center small">
            Mostrando <span th:text="${page.number * page.size + 1}"></span> -
            <span th:text="${page.last ? page.totalElements : (page.number + 1) * page.size}"></span>
            de <span th:text="${page.totalElements}"></span> expedientes
        </div>
    </div>
</body>

</html>
