<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}"></head>

<body>
    <div th:replace="~{layout :: body}">
        <div th:fragment="content" class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2><i class="bi bi-folder2-open icon-brand"></i> Expedientes</h2>
                <a th:href="@{/file/create}" class="btn btn-primary"
                    sec:authorize="hasRole('ADMIN') or hasRole('CREATE_FILE')"><i class="bi bi-plus-circle"></i> Nuevo
                    expediente</a>
            </div>

            <!-- Tabla -->
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Carátula</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="file : ${page.content}">
                            <td th:text="${file.id}"></td>
                            <td th:text="${file.cover}"></td>
                            <td>
                                <span class="badge" th:class="${fileStateClassMap.get(file.state)}"
                                    th:text="${file.state}"></span>
                            </td>
                            <td>
                                <a th:href="@{/file/detail/{id}(id=${file.id})}"
                                    class="btn btn-sm btn-outline-primary"><i class="bi bi-eye"></i></a>
                                <a th:href="@{/file/update/{id}(id=${file.id})}"
                                    class="btn btn-sm btn-outline-secondary"
                                    sec:authorize="hasRole('ADMIN') or hasRole('EDIT_FILE')"><i
                                        class="bi bi-pencil"></i></a>
                                <button class="btn btn-sm btn-outline-danger" data-bs-toggle="modal"
                                    data-bs-target="#confirmDeleteModal"
                                    th:data-delete-url="@{/api/file/delete/{id}(id=${file.id})}"
                                    th:data-delete-message="|¿Está seguro de eliminar el expediente: ${file.cover}?|"
                                    sec:authorize="hasRole('ADMIN') or hasRole('DELETE_FILE')">
                                    <i class="bi bi-trash3"></i>
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${page.empty}">
                            <td colspan="4" class="text-center">No hay expedientes</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Paginación -->
            <nav th:if="${page.totalPages > 1}" aria-label="Paginación de expedientes">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/file/list(page=${page.number - 1})}" tabindex="-1">Anterior</a>
                    </li>
                    <li th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}" class="page-item"
                        th:classappend="${i == page.number} ? 'active'">
                        <a class="page-link" th:href="@{/file/list(page=${i})}" th:text="${i+1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/file/list(page=${page.number + 1})}">Siguiente</a>
                    </li>
                </ul>
                <p class="text-center text-muted">
                    Mostrando <span th:text="${page.content.size()}"></span> expedientes de <span
                        th:text="${page.totalElements}"></span>.
                </p>
            </nav>
        </div>
    </div>

    <!-- Script para el modal de eliminación -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const deleteModal = document.getElementById('confirmDeleteModal');
            deleteModal.addEventListener('show.bs.modal', function (event) {
                const button = event.relatedTarget;
                const url = button.getAttribute('data-delete-url');
                const message = button.getAttribute('data-delete-message') || '¿Está seguro de eliminar este expediente?';
                document.getElementById('confirmDeleteMessage').textContent = message;
                document.getElementById('confirmDeleteForm').action = url;
            });
        });
    </script>
</body>

</html>
