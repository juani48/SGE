<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <div th:replace="~{layout :: body}">
        <div th:fragment="content" class="container-fluid">
            <h2 th:if="${user.id == null}"><i class="bi bi-plus-circle icon-brand"></i> Nuevo usuario</h2>
            <h2 th:if="${user.id != null}"><i class="bi bi-pencil icon-brand"></i> Editar usuario #<span th:text="${user.id}"></span></h2>

            <form th:action="${user.id == null} ? @{/api/admin/users/create} : @{/api/admin/users/update/{id}(id=${user.id})}" method="post" class="needs-validation" novalidate>
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label for="name" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}" required>
                </div>
                <div class="mb-3">
                    <label for="lastName" class="form-label">Apellido</label>
                    <input type="text" class="form-control" id="lastName" th:field="*{lastName}" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" th:field="*{password}" th:required="${user.id == null}">
                    <div class="form-text" th:if="${user.id != null}">Dejar en blanco para mantener la actual</div>
                </div>
                <div class="mb-3">
                    <label for="role" class="form-label">Rol</label>
                    <select class="form-select" id="role" th:field="*{role}">
                        <option value="USER">Usuario</option>
                        <option value="ADMIN">Administrador</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/admin/users}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
    <script>
        // Validación (igual que antes)
        (function() {
            'use strict';
            var forms = document.querySelectorAll('.needs-validation');
            Array.prototype.slice.call(forms).forEach(function(form) {
                form.addEventListener('submit', function(event) {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        })();
    </script>
</body>
</html>
