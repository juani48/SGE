<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <div th:replace="~{layout :: body}">
        <div th:fragment="content" class="container-fluid">
            <h2><i class="bi bi-person-circle icon-brand"></i> Mi perfil</h2>
            <div class="card">
                <div class="card-body">
                    <dl class="row">
                        <dt class="col-sm-3">Nombre</dt>
                        <dd class="col-sm-9" th:text="${user.name}"></dd>
                        <dt class="col-sm-3">Apellido</dt>
                        <dd class="col-sm-9" th:text="${user.lastName}"></dd>
                        <dt class="col-sm-3">Email</dt>
                        <dd class="col-sm-9" th:text="${user.email}"></dd>
                        <dt class="col-sm-3">Rol</dt>
                        <dd class="col-sm-9" th:text="${user.roles}"></dd>
                    </dl>
                    <a th:href="@{/profile/update}" class="btn btn-outline-primary"><i class="bi bi-pencil"></i> Editar perfil</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
